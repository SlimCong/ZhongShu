<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f5f4">
<title>健康日志</title>
<style>
:root{
  --bg:#f2f5f4;--card:#fff;--tx:#132420;--mu:#6a7b75;--ln:#e5ebe8;
  --pri:#0d9488;--pri-d:#0f766e;--pri-l:#e6f5f2;
  --red:#dc2626;--red-l:#fdeaea;
  --orange:#ea580c;--orange-l:#fff2e8;
  --blue:#0284c7;--blue-l:#e0f2fe;
  --purple:#7c3aed;--purple-l:#f3e8ff;
  --pink:#db2777;--pink-l:#fce7f3;
  --green:#16a34a;--green-l:#e8f5ec;
  --gold:#f59e0b;--gold-l:#fef3c7;
  --sh:0 1px 2px rgba(19,36,32,.03),0 2px 8px rgba(19,36,32,.04);
  --sh-lg:0 10px 40px rgba(19,36,32,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#e8edeb}
body{color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";overflow-x:hidden}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;padding-bottom:80px;position:relative}
main{padding:0 12px 24px;flex:1}
main.switching{animation:fadeSlideIn .25s ease}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1.3)}}
@keyframes ripple{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2.2);opacity:0}}
@keyframes confettiFall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes levelUpPulse{0%{transform:scale(1)}40%{transform:scale(1.15)}60%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes checkPop{0%{transform:scale(0) rotate(-90deg);opacity:0}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes shine{0%,100%{left:-100%}50%{left:150%}}
@keyframes scaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sparkle{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.3);opacity:1}}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}50%{transform:scale(1.15)}70%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}60%{transform:translateY(-5px)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes levelShine{0%{background-position:-200% 0}100%{background-position:200% 0}}

.card,.score-card,.goal-card,.action-card,.level-bar{animation:fadeSlideIn .45s cubic-bezier(.2,.9,.3,1) backwards}

.level-bar{background:linear-gradient(135deg,#0f766e,#134e4a);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:11px;color:#fff;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(15,118,110,.25)}
.level-bar::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 0%,rgba(255,255,255,.15),transparent 60%);pointer-events:none}
.level-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);background-size:200% 100%;animation:levelShine 4s linear infinite;pointer-events:none}
.level-badge{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f;font-weight:800;font-size:13px;padding:6px 11px;border-radius:9px;flex-shrink:0;box-shadow:0 2px 6px rgba(245,158,11,.5),inset 0 -2px 0 rgba(0,0,0,.1);letter-spacing:.02em;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.level-badge.levelup{animation:levelUpPulse .8s ease}
.level-badge::before{content:'⭐';font-size:9px;margin-right:3px;opacity:.8}
.xp-wrap{flex:1;min-width:0;position:relative;z-index:1}
.xp-top{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:4px;opacity:.9;font-weight:600;letter-spacing:.02em}
.xp-track{height:6px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;position:relative}
.xp-track>i{display:block;height:100%;background:linear-gradient(90deg,#5eead4,#14b8a6);border-radius:99px;transition:width .8s cubic-bezier(.2,.9,.3,1);box-shadow:0 0 8px rgba(94,234,212,.6);position:relative}
.xp-track>i::after{content:'';position:absolute;right:0;top:0;bottom:0;width:12px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6));border-radius:99px}
.streak-badge{background:linear-gradient(135deg,#f97316,#dc2626);color:#fff;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;flex-shrink:0;display:flex;align-items:center;gap:3px;box-shadow:0 2px 6px rgba(220,38,38,.4);position:relative;z-index:1}
.streak-badge.cold{background:rgba(255,255,255,.15);box-shadow:none;color:rgba(255,255,255,.6)}
.streak-badge.hot{animation:sparkle 2s ease-in-out infinite}

.card{background:var(--card);border-radius:16px;padding:15px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid rgba(229,235,232,.6);overflow:hidden;position:relative;transition:box-shadow .2s}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,#0d9488);opacity:.9}
.card.c-water{--acc:#0284c7}
.card.c-body{--acc:#0d9488}
.card.c-sleep{--acc:#7c3aed}
.card.c-ex{--acc:#ea580c}
.card.c-diet{--acc:#16a34a}
.card.c-sym{--acc:#dc2626}
.card.c-void{--acc:#0284c7}
.card.c-med{--acc:#db2777}
.card.c-skin{--acc:#db2777}
.card.c-note{--acc:#94a3b8}
.card .body{max-height:4000px;transition:max-height .4s cubic-bezier(.2,.9,.3,1),opacity .3s ease;opacity:1;overflow:hidden}
.card.collapsed .body{max-height:0;opacity:0}
.card.collapsed{padding-bottom:11px}
.card.collapsed .ch{margin-bottom:0}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:8px;cursor:pointer;user-select:none}
.ch .t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.ch .t .ico{font-size:17px}
.ch .s{font-size:11.5px;color:var(--mu);white-space:nowrap;font-weight:500;display:flex;align-items:center;gap:5px}
.ch .s .up{color:#dc2626;font-weight:700;animation:pop .4s ease}
.ch .s .down{color:#0d9488;font-weight:700;animation:pop .4s ease}
.ch .s .badge{background:#f4f7f6;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:600;color:#4a5b55}
.ch .caret{font-size:10px;color:var(--mu);transition:transform .3s;margin-left:2px;opacity:.6}
.card.collapsed .caret{transform:rotate(-90deg)}

.hd{padding:14px 6px 8px}
.datebar{display:flex;align-items:center;gap:6px}
.nbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--ln);background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--mu);cursor:pointer;flex-shrink:0;font-family:inherit;transition:all .15s}
.nbtn:active{background:#f1f5f3;transform:scale(.88)}
.nbtn.dis{opacity:.25;pointer-events:none}
.datebar .mid{text-align:center;flex:1;min-width:0;cursor:pointer}
.datebar .mid b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.datebar .mid span{display:block;font-size:11px;color:var(--mu);margin-top:2px}
.hd h1{font-size:15px;font-weight:500;color:var(--mu);margin:12px 6px 0}

.action-card{background:linear-gradient(135deg,#f0fbf8,#e6f5f2);border:1px solid #c9e8e2;border-radius:16px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.action-card::before{content:'✨';position:absolute;top:8px;right:14px;font-size:16px;animation:sparkle 2s ease-in-out infinite}
.action-card .at{font-size:13px;font-weight:700;color:var(--pri-d);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.action-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;font-size:13px;line-height:1.5;border-bottom:1px dashed rgba(13,148,136,.15)}
.action-item:last-child{border-bottom:none;padding-bottom:0}
.action-item .ai{flex-shrink:0;font-size:15px;margin-top:0}
.action-item .atx{flex:1;color:#1c3a34}
.action-item .atx b{color:#0f766e;font-weight:600}
.action-item.urgent .atx b{color:#c2410c}
.action-item.urgent .ai{animation:wiggle 1.5s ease-in-out infinite}

.score-inline{display:flex;align-items:center;gap:16px;padding:4px 0 14px;border-bottom:1px dashed var(--ln);margin-bottom:12px}
.score-ring{position:relative;width:88px;height:88px;flex-shrink:0}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .ring-arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.3,1);filter:drop-shadow(0 0 4px currentColor)}
.score-ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring .v b{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.03em}
.score-ring .v span{font-size:9px;color:var(--mu);margin-top:2px;font-weight:500}
.score-info{flex:1;min-width:0}
.score-info .lbl{font-size:14px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.score-info .lbl .emoji{font-size:16px}
.score-info .desc{font-size:12px;color:var(--mu);margin-top:3px;line-height:1.5}
.score-info .breakdown{margin-top:8px;padding-top:8px;border-top:1px dashed var(--ln)}
.score-info .breakdown .bi{font-size:11px;color:var(--mu);display:flex;justify-content:space-between;padding:2px 0;animation:fadeSlideIn .3s ease backwards}
.score-info .breakdown .bi b{color:#dc2626;font-weight:600}

.wsum{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 4px}
.wsum .n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;display:inline-flex;align-items:baseline}
.wsum .n small{font-size:12px;color:var(--mu);font-weight:500;margin-left:2px}
.wsum .pct{font-size:13px;font-weight:700}
.wsum .n.bump{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.bar{height:6px;background:#eef2f0;border-radius:99px;overflow:hidden;margin:8px 0 12px;position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#0d9488);border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1);position:relative}
.bar>i::after{content:'';position:absolute;right:0;top:0;bottom:0;width:8px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5))}
.bar>.ripple{position:absolute;top:50%;left:0;width:20px;height:20px;border-radius:50%;background:rgba(34,211,238,.5);transform:translate(-50%,-50%);animation:ripple .7s ease-out forwards;pointer-events:none}
.wrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--ln)}
.wrow:last-child{border-bottom:none;padding-bottom:0}
.wrow .wn{flex:1;font-size:13px;color:var(--tx);display:flex;align-items:center;gap:5px}
.wrow .wn .wi{font-size:14px}
.wrow .wv{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--mu);min-width:50px;text-align:right;transition:color .3s}
.wrow .wv.act{color:var(--pri-d);animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.wrow .wq{display:flex;gap:5px}
.wbtn{border:1px solid var(--ln);background:#fff;border-radius:9px;padding:6px 10px;font:600 12px/1 inherit;color:var(--tx);cursor:pointer;font-family:inherit;transition:all .15s;position:relative}
.wbtn:active{background:var(--pri-l);border-color:#a8d5cc;transform:scale(.88)}
.wbtn.neg{color:var(--mu);font-size:14px}
.wbtn.neg:disabled{opacity:.3;pointer-events:none}
.wtag{font-size:10px;color:var(--orange)}

.f{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--ln)}
.f:last-child{border-bottom:none;padding-bottom:0}
.f:first-child{padding-top:0}
.f label{font-size:12.5px;color:var(--mu);width:80px;flex-shrink:0;font-weight:500;display:flex;align-items:center;gap:5px}
.f label .li{font-size:13px}
.f .unit{font-size:12px;color:var(--mu);flex-shrink:0;font-weight:500}
.inp{flex:1;border:1px solid var(--ln);border-radius:10px;padding:9px 12px;font:14px inherit;color:var(--tx);background:#fafcfb;outline:none;min-width:0;font-variant-numeric:tabular-nums;transition:all .18s}
.inp:focus{border-color:#5eead4;background:#fff;box-shadow:0 0 0 3px rgba(13,148,136,.1)}
.inp::placeholder{color:#bcc8c3}
.inp.short{max-width:90px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--tx);font-family:inherit;font-weight:500;transition:all .15s;user-select:none}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600;animation:pop .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 6px rgba(13,148,136,.3)}
.chip.on.warn{background:var(--red);border-color:var(--red);box-shadow:0 2px 6px rgba(220,38,38,.3)}

.meal{margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--ln)}
.meal:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.meal-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.meal-hd .nm{font-size:13.5px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:5px}
.meal-hd .kc{font-size:11px;color:var(--mu);margin-left:auto;font-weight:500;background:#f4f7f6;padding:2px 8px;border-radius:99px}
.madd{width:28px;height:28px;border-radius:9px;border:1px solid var(--ln);background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--pri);cursor:pointer;flex-shrink:0;font-weight:500;font-family:inherit;transition:all .2s}
.madd:active{background:var(--pri-l);transform:scale(.88)}
.madd.on{background:var(--pri);color:#fff;border-color:var(--pri);transform:rotate(45deg)}
.mnut{width:28px;height:28px;border-radius:9px;border:1px solid var(--ln);background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--blue);cursor:pointer;flex-shrink:0;font-family:inherit;transition:all .2s}
.mnut.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.fchip{display:inline-flex;align-items:center;gap:5px;background:#f6f9f8;border:1px solid #e8efec;border-radius:9px;padding:6px 7px 6px 10px;font-size:12.5px;font-weight:500;animation:bounceIn .4s cubic-bezier(.34,1.56,.64,1)}
.fchip .x{color:#a3b3ad;font-size:15px;line-height:1;cursor:pointer;padding:0 3px}
.fchip .x:active{color:var(--red)}
.fchip.hz{background:var(--red-l);border-color:#f5c7c7;color:#a21a1a}
.fchip.wr{background:var(--orange-l);border-color:#fad3b5;color:#93481a}
.empty{font-size:12.5px;color:#b8c3bf;padding:3px 0;font-style:italic}
.picker{margin-top:12px;border-top:1px dashed var(--ln);padding-top:12px;animation:fadeSlideIn .3s ease}
.cats{display:flex;gap:6px;overflow-x:auto;padding:0 15px 10px;margin:0 -15px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;border:1px solid var(--ln);background:#fff;border-radius:99px;padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--mu);white-space:nowrap;font-family:inherit;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:4px}
.cat.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
.foods{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-height:260px;overflow-y:auto;margin-bottom:10px}
.food{text-align:left;border:1px solid var(--ln);background:#fff;border-radius:10px;padding:9px 11px;font:400 12.5px/1.3 inherit;color:var(--tx);cursor:pointer;font-family:inherit;transition:all .15s}
.food b{display:block;font-weight:600}
.food i{font-style:normal;font-size:10.5px;color:var(--mu);display:block;margin-top:3px}
.food i.hz{color:var(--red)}
.food i.wr{color:var(--orange)}
.free{display:flex;gap:7px;margin-top:9px}
.free .inp{flex:1}

.nut-bar{margin-top:8px;padding:8px 11px;background:linear-gradient(135deg,#e0f2fe,#f0f9ff);border:1px solid #bae6fd;border-radius:10px;font-size:11.5px;color:#075985;display:flex;align-items:center;gap:8px;line-height:1.5;animation:bounceIn .4s cubic-bezier(.34,1.56,.64,1)}
.nut-bar .nb-ico{flex-shrink:0;font-size:14px}
.nut-bar .nb-txt{flex:1;min-width:0}
.nut-bar .nb-x{color:#7dd3fc;font-size:15px;cursor:pointer;padding:0 3px;flex-shrink:0}
.nut-bar .nb-x:active{color:var(--red)}
.nut-bar b{color:#0c4a6e;font-weight:600}
.nut-label{font-size:12px;color:#0c4a6e;font-weight:600;margin-bottom:3px}

.sym{margin-bottom:14px}
.sym:last-child{margin-bottom:0}
.sym-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sym-hd .sn{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.sym-hd .sv{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--mu);background:#f4f7f6;padding:3px 9px;border-radius:99px;transition:all .3s}
.sym-hd .sv.on{color:var(--red);background:var(--red-l);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.dots{display:flex;gap:5px;margin-bottom:9px}
.dots.wrap{flex-wrap:wrap}
.dot{flex:1;min-width:34px;height:36px;border-radius:10px;border:1px solid var(--ln);background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--mu);cursor:pointer;transition:all .15s;font-family:inherit;padding:0 4px}
.dot:active{transform:scale(.88)}
.dot.on{background:var(--red);color:#fff;border-color:var(--red);animation:pop .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 6px rgba(220,38,38,.3)}
.dot.on.wr{background:var(--orange);border-color:var(--orange);box-shadow:0 2px 6px rgba(234,88,12,.3)}
.sub-lbl{font-size:11.5px;color:var(--mu);margin:9px 0 6px;font-weight:500;letter-spacing:.02em}
.sed-row{display:flex;gap:5px;margin-top:6px}
.sed-b{flex:1;border:1px solid var(--ln);background:#fff;border-radius:10px;padding:9px 0;font:600 12px/1 inherit;color:var(--mu);cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}
.sed-b:active{transform:scale(.88)}
.sed-b.on{background:var(--pri);color:#fff;border-color:var(--pri);animation:pop .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 6px rgba(13,148,136,.3)}

.skin-row{padding:11px 0;border-bottom:1px dashed var(--ln)}
.skin-row:last-child{border-bottom:none;padding-bottom:0}
.skin-row:first-child{padding-top:0}
.skin-name{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.skin-name .cur{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;margin-left:auto;transition:all .3s}
.skin-name .cur.none{background:#f4f7f6;color:var(--mu)}
.skin-name .cur.improve{background:var(--green-l);color:#15803d;animation:pop .35s ease}
.skin-name .cur.stable{background:var(--blue-l);color:#0369a1}
.skin-name .cur.worse{background:var(--red-l);color:var(--red);animation:pop .35s ease}
.skin-states{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:6px}
.skin-st{border:1.5px solid var(--ln);background:#fff;border-radius:10px;padding:9px 0;font:600 12px/1 inherit;color:var(--mu);cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}
.skin-st:active{transform:scale(.88)}
.skin-st.on{color:#fff;animation:pop .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 6px rgba(0,0,0,.15)}

.med-alert{background:linear-gradient(135deg,#fff8e6,#fef4dc);border:1px solid #f0dca8;border-radius:12px;padding:10px 13px;margin-bottom:11px;font-size:12.5px;color:#8a5a1a;line-height:1.5;display:flex;gap:8px;align-items:flex-start;animation:fadeSlideIn .4s ease}
.med-alert .ai{font-size:15px;flex-shrink:0;line-height:1.3}

<script>
/* ============ 0. 存储 ============ */
const LS=(function(){
  try{const t='__hltest__';window.localStorage.setItem(t,'1');window.localStorage.removeItem(t);
    return {ok:true,get:k=>window.localStorage.getItem(k),set:(k,v)=>window.localStorage.setItem(k,v),del:k=>window.localStorage.removeItem(k)};
  }catch(e){const m={};return {ok:false,get:k=>m[k]??null,set:(k,v)=>{m[k]=String(v)},del:k=>{delete m[k]}};}
})();
if(!LS.ok){
  document.getElementById('envbar-slot').innerHTML='<div style="background:#fff8e6;border-bottom:1px solid #f0e0b8;color:#8a6a1a;font-size:12.5px;line-height:1.55;padding:9px 14px;text-align:center">⚠️ 当前环境无法保存数据，刷新会重置。请把文件保存到本地用真实浏览器打开。</div>';
}

/* ============ 1. 数据 + 多档案 ============ */
const KEY='healthlog_v10', KEY_V9='healthlog_v9', KEY_V8='healthlog_v8';
const PINDEX_KEY='hl_profiles', PACTIVE_KEY='hl_active', DKEY=pid=>'hl_data_'+pid;

function genPid(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function readPI(){try{const a=JSON.parse(LS.get(PINDEX_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function writePI(l){try{LS.set(PINDEX_KEY,JSON.stringify(l))}catch(e){}}

  {id:'ua',name:'尿酸 + 肝功 + 血脂 + 血糖',dept:'风湿免疫科 / 内分泌科',months:3},
  {id:'uro',name:'泌尿外科',dept:'泌尿外科',months:6},

  {id:'ct',name:'胸部 CT',dept:'呼吸内科 / 胸外科',months:12},
  {id:'liver',name:'肝脏彩超',dept:'消化内科 / 肝科',months:12},
  {id:'eye',name:'眼底检查',dept:'眼科',months:12},
  {id:'dental',name:'口腔检查',dept:'口腔科',months:6},
  {id:'thyroid',name:'甲状腺彩超',dept:'内分泌科',months:12}
];

/* --- 自定义追踪项默认值 --- */
function defaultSymptomTrackers(){
  return [

function migrateDaySymptoms(d){
  if(!d || !d.symptoms) return;
  const old=d.symptoms;
  let isOld=false;
  ['back','joint','urinary'].forEach(k=>{
    if(old[k] && (old[k].triggers||old[k].reliefs||old[k].sites||old[k].nature||old[k].duration)) isOld=true;
  });
  if(!isOld) return;
  const ns={};
  if(old.back) ns.back={score:old.back.score||0, tags:[].concat(old.back.triggers||[], old.back.reliefs||[]).filter(Boolean)};
  if(old.joint) ns.joint={score:old.joint.score||0, tags:(old.joint.sites||[]).slice()};
  if(old.urinary) ns.urinary={score:old.urinary.score||0, tags:(old.urinary.sites||[]).slice()};
  d.symptoms=ns;
}
function migrate(raw){
  try{
    const p=JSON.parse(raw),d=defState();
    const prof=Object.assign({},d.profile,p.profile||{});
    prof.weightRef=Object.assign({},d.profile.weightRef,(p.profile&&p.profile.weightRef)||{});
    // 处理每日数据的旧结构
    const days=p.days||{};
    Object.keys(days).forEach(k=>{
      const dd=days[k];
      if(dd && dd.symptoms) migrateDaySymptoms(dd);
      if(dd && dd.skin){
        Object.keys(dd.skin).forEach(sk=>{
          if(OLD_SKIN_MAP[dd.skin[sk]]) dd.skin[sk]=OLD_SKIN_MAP[dd.skin[sk]];
        });
      }
      if(dd && dd.bowel && typeof dd.bowel.type==='number') dd.bowel.type=String(dd.bowel.type);
    });
    return{
      onboarded: p.onboarded===true || !!(p.profile&&p.profile.birthday),
      profile:prof,
      days:days,
      uric:Array.isArray(p.uric)?p.uric:[],
      history:Array.isArray(p.history)?p.history:[],
      checkups:Array.isArray(p.checkups)?p.checkups:[],
      meds:Array.isArray(p.meds)?p.meds:[],
      cfg:Object.assign({},d.cfg,p.cfg||{}),
      goal:p.goal||null,
      collapsed:p.collapsed||{},
      myFoods:Array.isArray(p.myFoods)?p.myFoods:[],
      gamification:Object.assign({},d.gamification,p.gamification||{}),
      symptomTrackers:Array.isArray(p.symptomTrackers)?p.symptomTrackers:defaultSymptomTrackers(),
      skinTrackers:Array.isArray(p.skinTrackers)?p.skinTrackers:defaultSkinTrackers(),
      bowelEnabled:p.bowelEnabled!==false,
      bowelTypeOptions:Array.isArray(p.bowelTypeOptions)&&p.bowelTypeOptions.length?p.bowelTypeOptions:['1','2','3','4','5','6','7']
    };
  }catch(e){ return defState(); }
}

const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const[y,m,d]=String(s||'').split('-').map(Number);return new Date(y||1970,(m||1)-1,d||1)};
const WD=['周日','周一','周二','周三','周四','周五','周六'];
const humanD=s=>{const d=parseD(s);return(d.getMonth()+1)+'/'+d.getDate()};
const humanFull=s=>{const d=parseD(s);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+WD[d.getDay()]};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
function calcAge(birthday){
  if(!birthday) return null;
  const b=parseD(birthday);if(isNaN(b.getTime()))return null;
  const now=new Date();
  let age=now.getFullYear()-b.getFullYear();
  const m=now.getMonth()-b.getMonth();
  if(m<0||(m===0&&now.getDate()<b.getDate())) age--;
  return age>=0?age:null;
}
function todayK(){
  const now=new Date();
  const cut=(S&&S.cfg&&S.cfg.dayCutoffHour)||4;
  if(now.getHours()<cut) now.setDate(now.getDate()-1);
  return fmt(now);
}
function isEarlyMorning(){
  const cut=(S&&S.cfg&&S.cfg.dayCutoffHour)||4;
  return new Date().getHours()<cut;
}

function getDay(k){

  ['breakfast','lunch','tea','dinner'].forEach(m=>{if(!Array.isArray(d.meals?.[m])) (d.meals=d.meals||{})[m]=[];});
  if(!d.nutrition||typeof d.nutrition!=='object') d.nutrition={};
  if(!d.symptoms||typeof d.symptoms!=='object') d.symptoms={};
  migrateDaySymptoms(d);
  (S.symptomTrackers||[]).forEach(t=>{
    if(!d.symptoms[t.id]||typeof d.symptoms[t.id]!=='object') d.symptoms[t.id]={score:0, tags:[]};
    if(!Array.isArray(d.symptoms[t.id].tags)) d.symptoms[t.id].tags=[];
    if(typeof d.symptoms[t.id].score!=='number') d.symptoms[t.id].score=0;
  });
  if(!d.skin||typeof d.skin!=='object') d.skin={};
  (S.skinTrackers||[]).forEach(t=>{
    if(d.skin[t.id]===undefined) d.skin[t.id]=null;
    if(OLD_SKIN_MAP[d.skin[t.id]]) d.skin[t.id]=OLD_SKIN_MAP[d.skin[t.id]];
  });
  if(!Array.isArray(d.exercise)) d.exercise=[];
  if(!d.medLog||typeof d.medLog!=='object') d.medLog={};
  if(!d.voiding) d.voiding={day:null,night:null,urgency:false,pain:false,incomplete:false};
  if(!d.bowel) d.bowel={count:null,type:null};
  if(typeof d.bowel.type==='number') d.bowel.type=String(d.bowel.type);
  return d;
}

function countMedDays(){
  const days=Object.keys(S.days).filter(k=>Object.values(S.days[k].medLog||{}).some(s=>Object.values(s).some(v=>v))).sort();
  let best=0,cur=0,last=null;
  days.forEach(k=>{
    if(last && diffDays(k,last)===1){cur++}else{cur=1}
    if(cur>best) best=cur;
    last=k;
  });
  return best;
}
function maxConsecutiveNoPurine(){
  const days=Object.keys(S.days).sort();let best=0,cur=0;
  days.forEach(k=>{
    if(dayStats(S.days[k]).hz===0){cur++;if(cur>best)best=cur}else cur=0;
  });
  return best;
}
function maxConsecutiveNoAlcohol(){
  const days=Object.keys(S.days).sort();let best=0,cur=0;
  days.forEach(k=>{
    if((S.days[k].water?.alcohol||0)===0){cur++;if(cur>best)best=cur}else cur=0;
  });

}
function weightDiff(){
  const keys=Object.keys(S.days).filter(k=>typeof S.days[k].weight==='number'&&S.days[k].weight>0).sort();
  if(!keys.length) return 0;
  return S.days[keys[0]].weight - S.days[keys[keys.length-1]].weight;
}

  ACHIEVEMENTS.forEach(a=>{

  });
  if(newly.length){

  }

function checkDailyBonus(){
  if(!S.gamification) return;
  const g=S.gamification;
  if(!g.dailyBonus) g.dailyBonus={};
  const today=todayK();
  if(g.dailyBonus[today]) return;
  const d=getDay(today);
  let cnt=0;
  if(waterTotal(d)>0) cnt++;
  if(MEALS.some(m=>(d.meals[m.k]||[]).length>0)) cnt++;
  if(d.weight!=null) cnt++;
  if(d.sleep?.hours) cnt++;
  if((d.exercise||[]).length) cnt++;
  if(totalSymptomScore(d)>0) cnt++;
  if(Object.values(d.skin||{}).some(v=>v)) cnt++;
  if(d.note&&d.note.trim()) cnt++;
  if(Object.values(d.medLog||{}).some(s=>Object.values(s).some(v=>v))) cnt++;
  if(cnt>=5){
    g.dailyBonus[today]=true;
    updateStreak();save();
    setTimeout(()=>{
      showXPFloat(XP.dailyBonus);
      S.gamification.xp += XP.dailyBonus;
      save();updateLevelBar();checkAchievements();
      confetti(20);toast('🎉 今日全勤 +30 XP');
    }, 600);
  }
}
function updateStreak(){
  if(!S.gamification) return;
  const g=S.gamification;
  const today=todayK();
  const activeDays=Object.keys(S.days).filter(k=>{
    const d=S.days[k];
    return waterTotal(d)>0 || d.weight!=null || MEALS.some(m=>(d.meals?.[m.k]||[]).length>0) || d.sleep || (d.exercise?.length) || d.note || totalSymptomScore(d)>0;
  }).sort();
  if(!activeDays.length){ g.streak=0; return; }
  let streak=0;let cur=parseD(today);
  while(true){
    const k=fmt(cur);
    if(activeDays.includes(k)){ streak++; cur.setDate(cur.getDate()-1); } else break;
  }
  g.streak=streak;
  if(streak>(g.bestStreak||0)) g.bestStreak=streak;
  g.lastActiveDate=today;
}

/* ============ 7. 计算 ============ */
function waterTotal(day){
  const w=day.water||{};
  return(w.plain||0)+(w.tea||0)+(w.coffee||0)+(w.diet||0);
}
function dayStats(day){
  let kcal=0,hz=0,wr=0;
  MEALS.forEach(m=>(day.meals?.[m.k]||[]).forEach(f=>{
    kcal+=f.kcal||0;
    if(f.lv===2) hz++; else if(f.lv===1) wr++;
  }));
  return{kcal,hz,wr};
}
function dayNutrition(day){
  const totals={protein:0,fat:0,carbs:0,kcal:0,sodium:0,has:false};
  if(!day.nutrition) return totals;
  Object.values(day.nutrition).forEach(n=>{
    if(!n) return;
    if(n.protein){totals.protein+=n.protein;totals.has=true}
    if(n.fat){totals.fat+=n.fat;totals.has=true}
    if(n.carbs){totals.carbs+=n.carbs;totals.has=true}
    if(n.kcal){totals.kcal+=n.kcal;totals.has=true}
    if(n.sodium){totals.sodium+=n.sodium;totals.has=true}
  });
  return totals;
}
function totalSymptomScore(day){
  let s=0;
  (S.symptomTrackers||[]).forEach(t=>{
    s += (day?.symptoms?.[t.id]?.score)||0;
  });
  return s;
}
function uricScoreDetail(day){
  const items=[];let s=100;
  const goal=S.cfg.waterGoal;const wt=waterTotal(day);
  if(wt<goal){const d=Math.round(25*(1-wt/goal));if(d>0) items.push({label:`补水不足（差 ${goal-wt}ml）`,delta:-d});s-=d}
  const st=dayStats(day);
  if(st.hz>0){const d=st.hz*10;items.push({label:`高嘌呤 ×${st.hz}`,delta:-d});s-=d}
  if(st.wr>0){const d=st.wr*4;items.push({label:`中风险 ×${st.wr}`,delta:-d});s-=d}
  if((day.water?.sugary||0)>0){items.push({label:'含糖饮料',delta:-6});s-=6}
  if((day.water?.alcohol||0)>0){items.push({label:'饮酒',delta:-15});s-=15}
  (S.symptomTrackers||[]).forEach(t=>{
    const sc=(day.symptoms?.[t.id]?.score)||0;
    if(sc>0){
      const d=sc*4;
      items.push({label:`${t.name} ${sc} 分`,delta:-d});
      s-=d;
    }
  });
  items.sort((a,b)=>a.delta-b.delta);
  return{score:Math.max(0,Math.min(100,s)),items};
}
function uricScore(day){ return uricScoreDetail(day).score; }

function deltaHTML(cur, ref){

function todayMedSchedule(){
  const activeMeds=(S.meds||[]).filter(m=>m.active);
  const groups={};TIME_SLOTS.forEach(t=>{groups[t.k]=[]});
  activeMeds.forEach(m=>{(m.times||[]).forEach(t=>{if(groups[t]) groups[t].push(m)})});
  return groups;
}
function isMedTaken(day,medId,slot){ return !!(day.medLog&&day.medLog[medId]&&day.medLog[medId][slot]); }
function yesterdayMissed(){
  const d=new Date(parseD(todayK()));d.setDate(d.getDate()-1);
  const k=fmt(d);const y=S.days[k];if(!y) return [];
  const missed=[];
  const activeMeds=(S.meds||[]).filter(m=>m.active);
  activeMeds.forEach(m=>{(m.times||[]).forEach(t=>{if(!isMedTaken(y,m.id,t)) missed.push({name:m.name,slot:t,date:k})})});
  return missed;
}
function dueReminders(day){
  const now=new Date();const curHour=now.getHours();
  const groups=todayMedSchedule();const due=[];
  TIME_SLOTS.forEach(t=>{
    if(groups[t.k].length===0) return;
    if(curHour<t.hour) return;
    const missing=groups[t.k].filter(m=>!isMedTaken(day,m.id,t.k));
    if(missing.length>0) due.push({slot:t,missing});
  });
  return due;
}

}

      alertHTML+=`<div class="med-alert danger"><span class="ai">⚠️</span><div><b>昨天有药没打勾</b>（${esc(names)}）。切到昨天补打勾。</div></div>`;
    }
  }

  const missDaysList=[];
  for(let i=1;i<=7;i++){const d=new Date();d.setDate(d.getDate()-i);const k=fmt(d);if(!S.days[k]) missDaysList.push(k)}
  const missCard=missDaysList.length>=2?`<div style="background:linear-gradient(135deg,#fffbf0,#fef7e6);border:1px solid #f0e0b8;border-radius:14px;padding:12px 14px;margin-bottom:10px;animation:fadeSlideIn .4s ease"><div style="font-size:12.5px;font-weight:600;color:#8a6a1a;margin-bottom:8px;display:flex;align-items:center;gap:6px">📌 过去 7 天有 ${missDaysList.length} 天没记录，点一下补</div><div style="display:flex;flex-wrap:wrap;gap:6px">${missDaysList.map(k=>`<button data-jump="${k}" style="border:1px solid #e8d9a8;background:#fff;border-radius:10px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:#8a6a1a;font-family:inherit;font-weight:500">${humanD(k)} ${WD[parseD(k).getDay()]}</button>`).join('')}</div></div>`:'';

  let goalCard='';
  if(S.goal&&S.goal.type==='weight'){
    const g2=S.goal;
    const wKeys=Object.keys(S.days).filter(k=>typeof S.days[k].weight==='number'&&S.days[k].weight>0).sort();
    const curW=wKeys.length?S.days[wKeys[wKeys.length-1]].weight:null;
    if(curW!=null){
      const total=g2.startValue-g2.targetValue;const done=g2.startValue-curW;
      const pct=total>0?Math.max(0,Math.min(100,Math.round(done/total*100))):0;
      const remain=diffDays(g2.endDate,todayK());
      const daysUsed=diffDays(todayK(),g2.startDate);
      const rate=daysUsed>0?done/daysUsed:0;const needRate=remain>0?(g2.targetValue-curW)/remain:-999;
      let pace='';if(rate>=needRate&&needRate>0) pace='按当前节奏能达标';else if(needRate>0) pace='按当前节奏偏慢';else pace='目标已到或已超额';
      goalCard=`<div class="goal-card"><div class="gt">🎯 阶段目标 · 体重</div><div class="gm"><span>${g2.startValue} → ${g2.targetValue} kg</span><span>${pct}%</span></div><div class="gb"><i style="width:${pct}%"></i></div><div class="gf">当前 <b>${curW} kg</b> · 已减 ${done.toFixed(1)} kg · 剩 ${remain>0?remain+' 天':'已到期'}<br>${pace}</div></div>`;
    }
  }

  const dateLabel=isToday?'今天':humanD(curDate);
  const subLabel=isToday&&early?'（凌晨归属昨日）':WD[parseD(curDate).getDay()];
  const datebar=`
    <div class="datebar">
      <button class="nbtn" data-day="-1">‹</button>
      <div class="mid" data-pickdate><b>${dateLabel}</b><span>${subLabel}</span></div>
      <button class="nbtn ${isToday?'dis':''}" data-day="1">›</button>
      <button class="nbtn" data-goto-cal>📅</button>
    </div>`;

  const R=34,C=2*Math.PI*R;
  const off=C*(1-sc/100);
  const waterTypes=[
    {k:'plain',n:'白水',i:'💧'},{k:'tea',n:'茶',i:'🍵'},{k:'coffee',n:'咖啡',i:'☕'},{k:'diet',n:'无糖饮料',i:'🥤'},
    {k:'sugary',n:'含糖饮料',warn:true,i:'🧃'},{k:'alcohol',n:'酒',warn:true,i:'🍺'}
  ];
  const waterRows=waterTypes.map(t=>{
    const v=day.water[t.k]||0;
    const canUndo=day.waterLog.some(l=>l.t===t.k);
    return `<div class="wrow"><div class="wn"><span class="wi">${t.i}</span>${t.n}${t.warn?' <span class="wtag">⚠</span>':''}</div><div class="wv ${v>0?'act':''}" data-wv="${t.k}">${v}ml</div><div class="wq"><button class="wbtn" data-water="${t.k}:200">+200</button><button class="wbtn" data-water="${t.k}:500">+500</button><button class="wbtn neg" data-water-undo="${t.k}" ${canUndo?'':'disabled'}>撤销</button></div></div>`;
  }).join('');
  const mergedBody=`
    <div class="score-inline">
      <div class="score-ring">
        <svg width="88" height="88" viewBox="0 0 88 88">
          <circle cx="44" cy="44" r="${R}" fill="none" stroke="#eef2f0" stroke-width="7"/>
          <circle class="ring-arc" cx="44" cy="44" r="${R}" fill="none" stroke="${scoreColor(sc)}" stroke-width="7"
            stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" stroke-linecap="round"
            data-target-offset="${off.toFixed(1)}" style="color:${scoreColor(sc)}"/>
        </svg>
        <div class="v"><b style="color:${scoreColor(sc)}" data-count-target="${sc}">0</b><span>健康分</span></div>
      </div>
      <div class="score-info">
        <div class="lbl"><span class="emoji">${scoreEmoji(sc)}</span>${scoreLabel(sc)}</div>
        <div class="desc">饮水 ${wt}/${goal}ml · 高嘌呤 ${st.hz} 项${nut.has?` · ${Math.round(nut.kcal)} kcal`:''}</div>
        ${detail.items.length?`<div class="breakdown">${detail.items.slice(0,4).map((it,i)=>`<div class="bi" style="animation-delay:${600+i*80}ms"><span>${esc(it.label)}</span><b>${it.delta}</b></div>`).join('')}</div>`:''}
      </div>
    </div>
    <div class="wsum">
      <div class="n" id="waterTotalNum">${wt}<small>/ ${goal} ml</small></div>
      <div class="pct" style="color:${wt>=goal?'#0d9488':'#ea580c'}">${wpct}%</div>
    </div>
    <div class="bar" id="waterBar"><i style="width:${wpct}%"></i></div>
    <div style="font-size:11px;color:var(--mu);margin-bottom:8px;line-height:1.5">白水+茶+咖啡+无糖饮料计入补水；撤销按时间倒序。</div>
    ${waterRows}`;
  const mergedCard=card('water','💧 饮水',`${scoreEmoji(sc)} ${scoreLabel(sc)} · ${wt}/${goal}ml`,mergedBody,'c-water');

  const mealsHTML=MEALS.map(m=>{
    const list=day.meals[m.k]||[];
    const nutData=day.nutrition?.[m.k];
    const foodKcal=list.reduce((a,f)=>a+(f.kcal||0),0);
    const totalKcal=nutData?.kcal||foodKcal;
    const open=picker.meal===m.k;
    const chips=list.length?`<div class="chips">${list.map((f,i)=>`<span class="fchip ${f.lv===2?'hz':f.lv===1?'wr':''}">${esc(f.n)}<span class="x" data-del-food="${m.k}:${i}">×</span></span>`).join('')}</div>`:`<div class="empty">还没记</div>`;
    const nutBar=nutData?`<div class="nut-bar"><span class="nb-ico">📊</span><div class="nb-txt">${nutData.label?`<div class="nut-label">${esc(nutData.label)}</div>`:''}${nutData.protein?`<b>蛋白</b> ${Math.round(nutData.protein)}g · `:''}${nutData.fat?`<b>脂肪</b> ${Math.round(nutData.fat)}g · `:''}${nutData.carbs?`<b>碳水</b> ${Math.round(nutData.carbs)}g · `:''}${nutData.kcal?`<b>${Math.round(nutData.kcal)}</b> kcal`:''}${nutData.sodium?` · <b>钠</b> ${Math.round(nutData.sodium)}mg`:''}</div><span class="nb-x" data-nut-del="${m.k}">×</span></div>`:'';
    let foods;
    if(picker.cat==='recent'){ foods=recentFoods.map(n=>allFoods().find(f=>f.n===n)).filter(Boolean); }
    else{ foods=allFoods().filter(f=>f.c===picker.cat); }
    const grid=foods.length?foods.map(f=>`<button class="food" data-add="${esc(f.n)}"><b>${esc(f.n)}</b><i class="${f.lv===2?'hz':f.lv===1?'wr':''}">${f.tag||(f.kcal?f.kcal+' kcal':'')}</i></button>`).join(''):`<div style="grid-column:1/-1;font-size:12.5px;color:#b8c3bf;padding:14px 0;text-align:center;font-style:italic">暂无</div>`;
    const pickerHTML=open?`<div class="picker"><div class="cats">${CATS.map(c=>`<div class="cat ${picker.cat===c.k?'on':''}" data-cat="${c.k}">${c.i||''} ${c.n}</div>`).join('')}</div><div class="foods">${grid}</div><div class="free"><input class="inp" id="freeInp" placeholder="手动输入食物名…"><select class="sel" id="freeLv" style="flex:0 0 90px"><option value="0">普通</option><option value="1">中风险</option><option value="2">高风险</option></select><button class="btn pri" style="flex:0 0 56px" data-free-add="${m.k}">加</button></div><div style="font-size:11px;color:var(--mu);margin-top:6px">手动加的会进「常用」</div></div>`:'';
    return `<div class="meal"><div class="meal-hd"><span class="nm">${m.i} ${m.n}</span>${totalKcal?`<span class="kc">${Math.round(totalKcal)} kcal</span>`:''}<div class="mnut ${nutData?'on':''}" data-nut-open="${m.k}" title="粘贴营养分析">📊</div><div class="madd ${open?'on':''}" data-open="${m.k}">+</div></div>${chips}${nutBar}${pickerHTML}</div>`;
  }).join('');
  const dietCard=card('diet','🍽️ 饮食',nut.has?`${Math.round(nut.kcal)} kcal`:st.kcal+' kcal',mealsHTML,'c-diet');

  /* ---- 症状（动态） ---- */
  const symptomTrackers=S.symptomTrackers||[];
  const symptomParts=symptomTrackers.map(t=>{
    const data=day.symptoms[t.id]||{score:0,tags:[]};
    const score=data.score||0;
    const tags=data.tags||[];
    const hasTags=score>0 && t.tagLabel && (t.tagOptions||[]).length>0;
    return `
      <div class="sym">
        <div class="sym-hd">
          <span class="sn">${t.icon||'•'} ${esc(t.name)}</span>
          <span class="sv ${score>0?'on':''}">${score>0?score+' 分':'—'}</span>
        </div>
        <div class="dots">${[0,1,2,3,4,5].map(v=>`<div class="dot ${score===v?'on':''}" data-sym-score="${t.id}:${v}">${v}</div>`).join('')}</div>
        ${hasTags?`
          <div class="sub-lbl">${esc(t.tagLabel)}</div>
          <div class="chips">${t.tagOptions.map(o=>`<div class="chip ${tags.includes(o)?'on':''}" data-sym-tag="${t.id}|${encodeURIComponent(o)}">${esc(o)}</div>`).join('')}</div>
        `:''}
      </div>`;
  }).join('');
  const sedentaryHTML=`
    <div style="margin-top:12px;padding-top:12px;${symptomTrackers.length?'border-top:1px dashed var(--ln)':''}">
      <div class="sub-lbl" style="margin-top:0">今天连续久坐最久一次</div>
      <div class="sed-row">${SED_OPTIONS.map(o=>`<div class="sed-b ${day.sedentary===o?'on':''}" data-sed="${o}">${o}</div>`).join('')}</div>
    </div>`;
  const anySymptom=symptomTrackers.some(t=>(day.symptoms?.[t.id]?.score||0)>0);
  const symCard=card('sym','🩺 症状', anySymptom?'有':(symptomTrackers.length?`${symptomTrackers.length} 项`:'未设置'),
    (symptomTrackers.length?symptomParts:`<div class="empty" style="text-align:center;padding:12px 0">还没有症状追踪项，去「我的」里添加</div>`)+sedentaryHTML,
    'c-sym');

  /* ---- 皮肤（动态） ---- */
  const skinTrackers=S.skinTrackers||[];
  const skinRows=skinTrackers.map(t=>{
    const cur=day.skin[t.id]||null;
    const options=(t.options&&t.options.length)?t.options:['无','好转','稳定','加重'];
    const curLabel=cur||'未记';
    const curCls=cur?skinCls(cur):'none';
    const buttons=options.map(o=>{
      const on=cur===o;
      const color=skinColor(o);
      const style=on?`background:${color};border-color:${color};color:#fff;`:'';
      return `<div class="skin-st ${on?'on':''}" data-skin="${t.id}|${encodeURIComponent(o)}" style="${style}">${esc(o)}</div>`;
    }).join('');
    return `<div class="skin-row"><div class="skin-name">${t.icon||''} ${esc(t.name)}<span class="cur ${curCls}">${esc(curLabel)}</span></div><div class="skin-states">${buttons}</div></div>`;
  }).join('');
  const skinSub=(()=>{
    if(!skinTrackers.length) return '未设置';
    const vals=Object.values(day.skin||{}).filter(v=>v);
    if(!vals.length) return '';
    const worse=vals.filter(v=>skinCls(v)==='worse').length;
    const improve=vals.filter(v=>skinCls(v)==='improve').length;
    if(worse>0) return worse+' 项加重';
    if(improve>0) return improve+' 项好转';
    return '稳定';
  })();
  const skinCard=skinTrackers.length?card('skin','🩹 皮肤',skinSub,skinRows,'c-skin'):'';

  /* ---- 排便（可开关） ---- */
  const bowelEnabled=S.bowelEnabled!==false;
  const bowelTypeOptions=S.bowelTypeOptions||[];
  const bowelBody=bowelEnabled?`
    <div class="f"><label>排便次数</label><input class="inp short" type="number" inputmode="numeric" data-bowel="count" value="${day.bowel.count??''}" placeholder="次"><span class="unit">次</span></div>
    ${bowelTypeOptions.length?`
      <div class="sub-lbl">性状</div>
      <div class="dots wrap">${bowelTypeOptions.map(o=>`<div class="dot ${day.bowel.type===o?'on wr':''}" data-bowel-t="${encodeURIComponent(o)}">${esc(o)}</div>`).join('')}</div>
    `:''}
  `:'<div class="empty" style="padding:6px 0">未启用排便追踪，去「我的」里开启</div>';
  const voidBody=`
    <div class="f"><label>白天排尿</label><input class="inp short" type="number" inputmode="numeric" data-void="day" value="${day.voiding.day??''}" placeholder="次"><span class="unit">次</span></div>
    <div class="f"><label>夜尿</label><input class="inp short" type="number" inputmode="numeric" data-void="night" value="${day.voiding.night??''}" placeholder="次"><span class="unit">次</span></div>
    <div class="sub-lbl">伴随症状</div>
    <div class="chips"><div class="chip ${day.voiding.urgency?'on':''}" data-void-flag="urgency">尿急</div><div class="chip ${day.voiding.pain?'on':''}" data-void-flag="pain">尿痛</div><div class="chip ${day.voiding.incomplete?'on':''}" data-void-flag="incomplete">尿不尽</div></div>
    <div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--ln)">
      ${bowelBody}
    </div>`;
  const voidCard=card('void','🚻 排尿 / 排便','',voidBody,'c-void');

  const lastW=lastWeightBefore(curDate);const w7=weight7DaysBefore(curDate);
  let weightSub='';
  if(day.weight!=null){
    const d1=lastW?`比上次 ${deltaHTML(day.weight,lastW.value)}`:'';
    const d2=w7?`7天 ${deltaHTML(day.weight,w7.value)}`:'';
    weightSub=[d1,d2].filter(Boolean).join(' · ');
  }
  const bodyBody=`
    <div class="f"><label><span class="li">⚖️</span>体重</label><input class="inp" type="number" inputmode="decimal" step="0.1" data-field="weight" value="${day.weight!=null?day.weight:''}" placeholder="70.0"><span class="unit">kg</span></div>
    ${day.weight!=null&&lastW?`<div style="font-size:11.5px;color:var(--mu);padding:4px 0 2px 90px">上次 ${lastW.value} kg（${humanD(lastW.date)}） ${deltaHTML(day.weight,lastW.value)}</div>`:''}
    <div class="f"><label><span class="li">📏</span>腰围</label><input class="inp" type="number" inputmode="decimal" step="0.1" data-field="waist" value="${day.waist!=null?day.waist:''}" placeholder="肚脐水平"><span class="unit">cm</span></div>
    <div class="f"><label><span class="li">🩺</span>血压</label><input class="inp short" type="number" inputmode="numeric" data-bp="sys" value="${day.bp?.sys??''}" placeholder="收缩"><span style="color:var(--mu);font-size:12px">/</span><input class="inp short" type="number" inputmode="numeric" data-bp="dia" value="${day.bp?.dia??''}" placeholder="舒张"><span class="unit">mmHg</span></div>
    <div class="f"><label><span class="li">❤️</span>心率</label><input class="inp short" type="number" inputmode="numeric" data-bp="hr" value="${day.bp?.hr??''}" placeholder="可选"><span class="unit">bpm</span></div>`;
  const bodyCard=card('body','⚖️ 身体',weightSub,bodyBody,'c-body');

  const sleepBody=`
    <div class="f"><label><span class="li">😴</span>睡眠时长</label><input class="inp" type="number" inputmode="decimal" step="0.5" data-sleep="hours" value="${day.sleep?.hours??''}" placeholder="例如 7"><span class="unit">h</span></div>
    <div class="f"><label><span class="li">🌙</span>夜尿次数</label><input class="inp" type="number" inputmode="numeric" data-sleep="nocturia" value="${day.sleep?.nocturia??''}" placeholder="起夜几次"><span class="unit">次</span></div>
    <div class="sub-lbl">睡眠质量</div>
    <div class="dots">${[1,2,3,4,5].map(v=>`<div class="dot ${day.sleep?.quality===v?'on wr':''}" data-sleep-q="${v}">${v}</div>`).join('')}</div>`;
  const sleepCard=card('sleep','🌙 睡眠',day.sleep?.hours?day.sleep.hours+' h':'',sleepBody,'c-sleep');

  const exRows=(day.exercise||[]).map((e,i)=>`<div class="ex"><div style="flex:1;min-width:0"><div class="en">${esc(e.type)}</div><div class="em">${e.duration} 分钟 · ${EX_INTENSITY[e.intensity]||''}${e.backReaction!=null?' · 腰反应 '+e.backReaction+'分':''}</div></div><span class="x" data-del-ex="${i}">×</span></div>`).join('');
  const exBody=`
    ${exRows||'<div class="empty">今天还没记运动</div>'}
    <div class="addrow"><select class="sel" id="exType">${EX_TYPES.map(t=>`<option>${t}</option>`).join('')}</select><input class="inp short" id="exDur" type="number" inputmode="numeric" placeholder="分钟" style="flex:0 0 80px"></div>
    <div class="addrow"><select class="sel" id="exInt"><option value="low">轻松</option><option value="mid" selected>中等</option><option value="high">吃力</option></select><input class="inp short" id="exBack" type="number" inputmode="numeric" placeholder="腰反应 0–5" style="flex:0 0 120px"></div>
    <div class="addrow"><button class="btn pri" data-add-ex style="flex:1">加入运动</button></div>`;
  const exCard=card('ex','🏃 运动',(day.exercise||[]).length+' 项',exBody,'c-ex');

  const noteBody=`<textarea class="inp" rows="3" data-note placeholder="用药感受、身体变化、其他…" style="resize:vertical">${esc(day.note||'')}</textarea><div style="font-size:11px;color:var(--mu);margin-top:6px">历史备注在「我的」→ 历史备注里翻</div>`;
  const noteCard=card('note','📝 备注','',noteBody,'c-note');

  const tips=[];
  if(wt<goal) tips.push({t:`补水还差 <b>${goal-wt} ml</b>。`,bad:true});else tips.push({t:'补水达标。',bad:false});
  if(st.hz) tips.push({t:`今天有 <b>${st.hz}</b> 项高嘌呤食物。`,bad:true});
  if(day.water.sugary) tips.push({t:'含糖饮料（果糖）同时推高尿酸和脂肪肝风险。',bad:true});
  if(day.water.alcohol) tips.push({t:'喝酒了 —— 酒精会直接让尿酸飙升。',bad:true});
  const backScore=(day.symptoms?.back?.score)||0;
  if(backScore>=3) tips.push({t:'腰痛 ≥3 分 —— 若往腿上跑、麻木无力，立即就医。',bad:true});
  const jointScore=(day.symptoms?.joint?.score)||0;
  if(jointScore>=3) tips.push({t:'关节痛 ≥3 分 —— 痛风发作别硬扛。',bad:true});
  if(day.sedentary==='>4小时') tips.push({t:'今天久坐超过 4 小时，起来走 2 分钟。',bad:true});
  if(day.sleep?.hours&&day.sleep.hours<S.cfg.sleepGoal) tips.push({t:`睡眠 ${day.sleep.hours}h，低于目标。`,bad:true});
  if(nut.has&&nut.kcal>S.cfg.kcalGoal) tips.push({t:`今日约 ${Math.round(nut.kcal)} kcal，超过目标。`,bad:true});
  if(nut.has&&nut.sodium>3000) tips.push({t:`今日钠 ${Math.round(nut.sodium)}mg，明显超标。`,bad:true});
  const tipCard=`<div class="card c-note"><div class="ch"><span class="t"><span class="ico">💡</span> 今日提醒</span></div>${tips.map(x=>`<div class="tip ${x.bad?'':'ok'}"><i class="dt"></i><div>${x.t}</div></div>`).join('')}</div>`;

  return `
    <div class="hd">${datebar}<h1>${isToday?'今天也好好照顾自己':humanFull(curDate)}</h1></div>
    ${levelBar}
    ${actionCard(day,isToday)}
    ${alertHTML}
    ${missCard}
    ${goalCard}
    ${mergedCard}
    ${dietCard}
    ${medCardHTML}
    ${symCard}
    ${bodyCard}
    ${sleepCard}
    ${exCard}
    ${skinCard}
    ${voidCard}
    ${noteCard}
    ${tipCard}
  `;
}

/* ============ 11. 日历 ============ */
function calView(){
  cardIndex=0;
  const today=todayK();
  const base=curDate?parseD(curDate):parseD(today);
  if(!calMonth) calMonth={y:base.getFullYear(),m:base.getMonth()};
  const first=new Date(calMonth.y,calMonth.m,1);
  const lastDay=new Date(calMonth.y,calMonth.m+1,0).getDate();
  const startWd=first.getDay();
  const wdHeader=['日','一','二','三','四','五','六'].map(w=>`<div class="cal-wd">${w}</div>`).join('');
  let cells='';
  for(let i=0;i<startWd;i++) cells+='<div class="cal-d empty"></div>';
  for(let d=1;d<=lastDay;d++){
    const dk=`${calMonth.y}-${pad(calMonth.m+1)}-${pad(d)}`;
    const day=S.days[dk];
    let lv='';
    if(day){const sc=uricScore(day);if(sc!=null){if(sc>=85) lv='lv3';else if(sc>=65) lv='lv2';else if(sc>=50) lv='lv1';else lv='lv0'}}
    const isToday=dk===today;const isSel=dk===curDate;
    const hasData=day&&waterTotal(day)>0;
    cells+=`<div class="cal-d ${lv} ${isToday?'today':''} ${isSel?'sel':''}" data-jump="${dk}"><span class="dn">${d}</span>${day?.weight?`<span class="dd">${day.weight.toFixed(1)}</span>`:''}${hasData?'<span class="dot-mini"></span>':''}</div>`;
  }
  let daysWithData=0,okWater=0,alcDays=0,exDays=0,hzTotal=0;
  for(let d=1;d<=lastDay;d++){
    const dk=`${calMonth.y}-${pad(calMonth.m+1)}-${pad(d)}`;
    const day=S.days[dk];if(!day) continue;
    daysWithData++;
    if(waterTotal(day)>=S.cfg.waterGoal) okWater++;
    if((day.water?.alcohol||0)>0) alcDays++;
    if((day.exercise||[]).length) exDays++;
    hzTotal+=dayStats(day).hz;
  }
  const monthName=`${calMonth.y}年${calMonth.m+1}月`;
  return `
    <div class="hd"><div class="cal-hd"><button class="nbtn" data-cal="-1">‹</button><b>${monthName}</b><button class="nbtn" data-cal="1">›</button></div></div>
    <div class="card" style="padding:16px 14px">
      <div class="cal-grid">${wdHeader}${cells}</div>
      <div class="legend"><span><i style="background:#dbf0eb;border-color:#93cec3"></i>优秀 ≥85</span><span><i style="background:#f0f9f7;border-color:#c3e4de"></i>良好 65–84</span><span><i style="background:#fff2e8;border-color:#fad3b5"></i>一般 50–64</span><span><i style="background:#fdeaea;border-color:#f5c7c7"></i>较差 &lt;50</span></div>
    </div>
    <div class="card"><div class="ch"><span class="t"><span class="ico">📊</span> ${monthName} 汇总</span></div><div class="rec"><span class="k">记录天数</span><span class="v">${daysWithData} 天</span></div><div class="rec"><span class="k">饮水达标</span><span class="v">${okWater} 天</span></div><div class="rec"><span class="k">饮酒天数</span><span class="v ${alcDays>2?'bad':''}">${alcDays} 天</span></div><div class="rec"><span class="k">运动天数</span><span class="v">${exDays} 天</span></div><div class="rec"><span class="k">高嘌呤次数</span><span class="v ${hzTotal>10?'bad':''}">${hzTotal} 次</span></div></div>`;
}

/* ============ 12. 趋势 ============ */
function trendView(){
  cardIndex=0;
  const recent=[];
  for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=fmt(d);if(S.days[k]) recent.push({k,day:S.days[k]})}
  const rel=[];
  const activeMeds=(S.meds||[]).filter(m=>m.active);
  activeMeds.forEach(m=>{
    const daysOn=recent.filter(x=>(m.times||[]).some(t=>isMedTaken(x.day,m.id,t)));
    const daysOff=recent.filter(x=>(m.times||[]).some(t=>!isMedTaken(x.day,m.id,t)));
    if(daysOn.length>=2 && daysOff.length>=2){
      const avgOn=daysOn.reduce((a,x)=>a+totalSymptomScore(x.day),0)/daysOn.length;
      const avgOff=daysOff.reduce((a,x)=>a+totalSymptomScore(x.day),0)/daysOff.length;
      if(Math.abs(avgOn-avgOff)>=0.5){
        if(avgOn<avgOff) rel.push(`吃「${m.name}」的日子，症状平均 ${avgOn.toFixed(1)} 分，比没吃的 ${avgOff.toFixed(1)} 分低。`);
        else rel.push(`吃「${m.name}」的日子，症状平均 ${avgOn.toFixed(1)} 分，比没吃的 ${avgOff.toFixed(1)} 分高。`);
      }
    }
  });
  const alc=recent.filter(x=>(x.day.water?.alcohol||0)>0);
  const alcWeak=alc.filter(x=>{const d2=new Date(parseD(x.k));d2.setDate(d2.getDate()+1);const nd=S.days[fmt(d2)];return nd&&waterTotal(nd)<S.cfg.waterGoal});
  if(alc.length>=2&&alcWeak.length>=alc.length*0.6) rel.push(`近两周 ${alc.length} 次饮酒，其中 ${alcWeak.length} 次第二天饮水没达标。`);
  const sed4=recent.filter(x=>x.day.sedentary==='>4小时');
  const sed4Back=sed4.filter(x=>totalSymptomScore(x.day)>=2);
  if(sed4.length>=2&&sed4Back.length>=2) rel.push(`久坐>4h 的 ${sed4.length} 天里，有 ${sed4Back.length} 天有症状 ≥2 分。`);
  const lowS=recent.filter(x=>(x.day.sleep?.hours||99)<6);
  if(lowS.length>=3) rel.push(`近两周有 ${lowS.length} 天睡不到 6 小时。`);
  // 症状诱因统计
  const triggerCount={};
  (S.symptomTrackers||[]).forEach(t=>{
    recent.forEach(x=>{
      const tags=x.day.symptoms?.[t.id]?.tags||[];
      tags.forEach(tg=>{const key=`${t.name}·${tg}`;triggerCount[key]=(triggerCount[key]||0)+1});
    });
  });
  const topTriggers=Object.entries(triggerCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  if(topTriggers.length) rel.push(`高频标签：${topTriggers.map(([t,c])=>`${t} ${c} 次`).join('、')}。`);
  if(!rel.length) rel.push('数据还不够，多记几天就能看出规律。');
  const relCard=`<div class="card c-note"><div class="ch"><span class="t"><span class="ico">🔗</span> 关联提示</span></div>${rel.map(r=>`<div class="tip ok"><i class="dt"></i><div>${esc(r)}</div></div>`).join('')}</div>`;
  const wKeys=Object.keys(S.days).filter(k=>typeof S.days[k].weight==='number'&&S.days[k].weight>0).sort();
  const latestW=wKeys.length?S.days[wKeys[wKeys.length-1]].weight:null;
  const uaSorted=[...S.uric].sort((a,b)=>a.date.localeCompare(b.date));
  const lastUA=uaSorted[uaSorted.length-1];
  const uaDays=daysSinceLastUA();
  return `
    <div class="hd"><h1>趋势</h1></div>
    <div class="card c-body"><div class="ch"><span class="t"><span class="ico">⚖️</span> 体重</span><span class="s">${wKeys.length} 次</span></div><canvas id="cW" style="width:100%;height:150px;display:block"></canvas><div class="sg" style="margin-top:12px"><div class="st2"><span class="ico">⚖️</span><b>${latestW!=null?latestW.toFixed(1):'—'}</b><span>当前 kg</span></div><div class="st2"><span class="ico">🎯</span><b>${S.cfg.weightGoal}</b><span>目标 kg</span></div></div></div>
    <div class="card c-water"><div class="ch"><span class="t"><span class="ico">💧</span> 饮水（近 14 天）</span></div><canvas id="cWa" style="width:100%;height:130px;display:block"></canvas></div>
    <div class="card c-sleep"><div class="ch"><span class="t"><span class="ico">🌙</span> 睡眠（近 14 天）</span></div><canvas id="cSleep" style="width:100%;height:130px;display:block"></canvas></div>
    <div class="card c-sym"><div class="ch"><span class="t"><span class="ico">🩸</span> 尿酸</span><span class="s">目标 &lt; ${S.cfg.uaGoal}${uaDays!=null?` · 距上次 ${uaDays} 天`:''}</span></div><canvas id="cU" style="width:100%;height:140px;display:block"></canvas>${lastUA?`<div style="font-size:12px;color:var(--mu);margin-top:10px">最近：<b style="color:${lastUA.value>S.cfg.uaGoal?'#dc2626':'#0d9488'}">${lastUA.value}</b> umol/L（${humanD(lastUA.date)}）</div>`:''}${uaDays!=null&&uaDays>=S.cfg.uaTestInterval?`<div style="font-size:12px;color:#c2410c;margin-top:6px">⚠️ 距上次已 ${uaDays} 天，建议去测一次</div>`:''}</div>
    <div class="card c-diet"><div class="ch"><span class="t"><span class="ico">📊</span> 热量（近 14 天）</span><span class="s">目标 &lt; ${S.cfg.kcalGoal}</span></div><canvas id="cKcal" style="width:100%;height:130px;display:block"></canvas></div>
    ${relCard}`;
}

/* ============ 13. 复查 ============ */
function nextDateOf(it){ const d=parseD(it.last);d.setMonth(d.getMonth()+(it.months||12));return d; }
function checkView(){
  cardIndex=0;
  const today=todayK();
  const items=(S.checkups||[]).map(it=>{const nd=nextDateOf(it);return{...it,next:fmt(nd),diff:diffDays(fmt(nd),today)}}).sort((a,b)=>a.diff-b.diff);
  const overdue=items.filter(i=>i.diff<0);
  const rows=items.length?items.map(it=>{
    let cls='ok',txt='';
    if(it.diff<0){cls='over';txt='逾期 '+Math.abs(it.diff)+' 天';}
    else if(it.diff<=14){cls='soon';txt='还有 '+it.diff+' 天';}
    else{cls='ok';txt='还有 '+it.diff+' 天';}
    return `<div class="chk"><div class="info"><div class="nm">${esc(it.name)}</div><div class="mt">${it.dept?esc(it.dept)+' · ':''}每 ${it.months} 个月 · 下次 ${it.next}</div></div><span class="pill ${cls}">${txt}</span><button class="mbtn" data-done="${it.id}">完成</button><button class="mbtn" data-check-edit="${it.id}">改</button></div>`;

    <div class="hd"><h1>复查提醒</h1></div>
    ${overdue.length?`<div class="card" style="border-color:#f5c7c7;background:#fffbfb"><div class="ch"><span class="t" style="color:#dc2626"><span class="ico">⚠️</span> 已逾期 ${overdue.length} 项</span></div>${overdue.map(i=>`<div class="tip"><i class="dt"></i><div><b>${esc(i.name)}</b><br><span style="color:var(--mu);font-size:12px">${esc(i.dept||'')} · 逾期 ${Math.abs(i.diff)} 天</span></div></div>`).join('')}</div>`:''}

      <div class="tip"><i class="dt"></i><div><b>腿麻、无力、大小便异常</b> → 立即急诊</div></div>
      <div class="tip"><i class="dt"></i><div><b>大量飞蚊、闪光、视野遮挡</b> → 立即眼科</div></div>

/* ============ 14. 成就页 ============ */
function achView(){
  cardIndex=0;
  const g=S.gamification||defState().gamification;
  const unlocked=g.achievements||[];
  const lv=levelOf(g.xp);const xpIn=xpInLevel(g.xp);
  const unlockedCount=unlocked.length;const total=ACHIEVEMENTS.length;
  const pctUnlocked=Math.round(unlockedCount/total*100);
  const cats=['连续','饮水','饮食','用药','体重','自律','运动','其他','等级'];
  let sectionsHTML='';
  cats.forEach(cat=>{
    const list=ACHIEVEMENTS.filter(a=>a.cat===cat);
    if(!list.length) return;
    const unlockedInCat=list.filter(a=>unlocked.includes(a.id)).length;
    sectionsHTML+=`<div class="ach-sec">${cat} · ${unlockedInCat}/${list.length}</div>`;
    sectionsHTML+=`<div class="ach-grid">${list.map((a,i)=>{
      const isUnlocked=unlocked.includes(a.id);
      let curVal=0;
      try{ curVal=a.val(g) }catch(e){}
      const progress=Math.min(100,Math.round(curVal/a.goal*100));
      return `<div class="ach ${isUnlocked?'unlocked':'locked'}" data-ach-id="${a.id}" style="animation-delay:${i*30}ms">
        ${isUnlocked?`<span class="ac">✓</span>`:''}
        <div class="ai">${a.icon}</div>
        <div class="an">${esc(a.name)}</div>
        ${!isUnlocked?`<div class="ap"><i style="width:${progress}%"></i></div>`:''}
        ${!isUnlocked?`<div style="font-size:9px;color:var(--mu);margin-top:3px">${curVal}/${a.goal}</div>`:''}
      </div>`;
    }).join('')}</div>`;
  });
  return `
    <div class="hd"><h1>成就</h1></div>
    <div class="level-bar" style="margin-bottom:12px">
      <div class="level-badge">Lv.${lv}</div>
      <div class="xp-wrap"><div class="xp-top"><span>经验值</span><span>${xpIn}/100 XP</span></div><div class="xp-track"><i style="width:${xpIn}%"></i></div></div>
      <div class="streak-badge ${g.streak>0?(g.streak>=7?'hot':''):'cold'}">🔥 ${g.streak||0}天</div>
    </div>
    <div class="card">
      <div class="ch"><span class="t"><span class="ico">🏆</span> 成就进度</span><span class="s">${unlockedCount}/${total}</span></div>
      <div class="sg"><div class="st2"><span class="ico">🎖️</span><b>${unlockedCount}</b><span>已解锁</span></div><div class="st2"><span class="ico">⭐</span><b>${g.xp||0}</b><span>总 XP</span></div><div class="st2"><span class="ico">🔥</span><b>${g.bestStreak||0}</b><span>最长连续</span></div></div>
      <div class="bar" style="margin-top:12px"><i style="width:${pctUnlocked}%"></i></div>
      <div style="font-size:11px;color:var(--mu);text-align:right">${pctUnlocked}%</div>
    </div>
    ${sectionsHTML}
    <div class="card c-note"><div class="ch"><span class="t"><span class="ico">💡</span> 怎么获得 XP</span></div>
      <div class="tip"><i class="dt"></i><div>饮水 +200 = <b>3 XP</b>，+500 = <b>6 XP</b></div></div>
      <div class="tip"><i class="dt"></i><div>每记一样食物 = <b>3 XP</b></div></div>
      <div class="tip"><i class="dt"></i><div>粘贴营养分析 = <b>15 XP</b></div></div>
      <div class="tip"><i class="dt"></i><div>记体重 = <b>12 XP</b>，腰围 = <b>10 XP</b></div></div>
      <div class="tip"><i class="dt"></i><div>记睡眠 / 运动 / 用药 = <b>8–10 XP</b></div></div>
      <div class="tip"><i class="dt"></i><div><b>一天完成 ≥5 项</b> = <b>+30 XP 全勤奖</b></div></div>
    </div>`;
}

/* ============ 15.5 首次引导 / 编辑基本资料 ============ */
function collectSetup(){
  const g=id=>document.getElementById(id);
  if(g('suName')) setupTmp.name=g('suName').value.trim();
  if(g('suBirth')) setupTmp.birthday=g('suBirth').value;
  if(g('suHeight')) setupTmp.height=g('suHeight').value;
  if(g('suWeight')) setupTmp.weight=g('suWeight').value;
  if(g('suUA')) setupTmp.ua=g('suUA').value;
}
function openSetup(first){
  const p=S.profile||{};
  const cp=curProfile();
  setupTmp={
    first:!!first,
    name:cp.name||'我',
    sex:p.sex||'男',
    birthday:p.birthday||'',
    height:p.height!=null?p.height:'',
    weight:(p.weightRef&&p.weightRef.value!=null)?p.weightRef.value:'',
    ua:p.ua!=null?p.ua:'',
    picks:[]
  };
  renderSetup();
  document.getElementById('setupModal').classList.add('show');
}
function renderSetup(){
  const t=setupTmp;
  document.getElementById('setupTitle').textContent=t.first?'欢迎使用 · 填一下基本资料':'编辑基本资料';
  document.getElementById('setupBody').innerHTML=`
    ${t.first?`<div style="background:linear-gradient(135deg,#e6f5f2,#f0fbf8);border:1px solid #c9e8e2;border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.6;color:#1c3a34;margin-bottom:16px">👋 所有数据只存在你自己的设备上，不上传任何服务器。填完就能开始记录。</div>`:''}
    <div class="f"><label>档案名</label><input class="inp" id="suName" value="${esc(t.name)}" placeholder="你的名字 / 昵称"></div>
    <div class="f"><label>性别</label><div class="chips"><div class="chip ${t.sex==='男'?'on':''}" data-su-sex="男">男</div><div class="chip ${t.sex==='女'?'on':''}" data-su-sex="女">女</div></div></div>
    <div class="f"><label>生日</label><input class="inp" type="date" id="suBirth" value="${esc(t.birthday)}"></div>
    <div class="f"><label>身高</label><input class="inp short" type="number" inputmode="decimal" id="suHeight" value="${t.height}" placeholder="170"><span class="unit">cm</span></div>
    <div class="f"><label>体重</label><input class="inp short" type="number" inputmode="decimal" step="0.1" id="suWeight" value="${t.weight}" placeholder="70"><span class="unit">kg</span></div>
    <div class="f"><label>尿酸</label><input class="inp short" type="number" inputmode="numeric" id="suUA" value="${t.ua}" placeholder="可留空"><span class="unit">umol/L</span></div>
    ${t.first?`
      <div class="sub-lbl" style="margin-top:18px">想跟踪哪些复查？（可多选，之后也能改）</div>
      <div class="chips">${CHECKUP_TEMPLATES.map(c=>`<div class="chip ${t.picks.includes(c.id)?'on':''}" data-su-pick="${c.id}">${esc(c.name)}</div>`).join('')}</div>
      <div style="font-size:11.5px;color:var(--mu);margin-top:10px;line-height:1.5">不选也行，之后在「复查」页可以随时添加。症状、皮肤、排便都能在「我的」里自定义。</div>
    `:''}
  `;
  document.getElementById('setupFt').innerHTML=`<button class="btn pri" id="suSave" style="flex:1">${t.first?'开始使用':'保存'}</button>`;
}
function saveSetup(){
  collectSetup();
  const t=setupTmp;
  const height=parseFloat(t.height), weight=parseFloat(t.weight), ua=parseFloat(t.ua);
  S.profile.sex=t.sex;
  S.profile.birthday=t.birthday||'';
  S.profile.height=(!isNaN(height)&&height>0)?height:null;
  S.profile.weightRef=(!isNaN(weight)&&weight>0)?{date:todayK(),value:weight}:{date:'',value:null};
  S.profile.ua=(!isNaN(ua)&&ua>0)?ua:null;
  if(t.first){
    if(!Array.isArray(S.checkups)) S.checkups=[];
    CHECKUP_TEMPLATES.forEach(c=>{
      if(t.picks.includes(c.id) && !S.checkups.some(x=>x.tid===c.id)){
        S.checkups.push({id:genId('c'),tid:c.id,name:c.name,dept:c.dept,months:c.months,last:todayK()});
      }
    });
    if(S.profile.ua) S.uric.push({date:todayK(),value:S.profile.ua});
    if(S.profile.weightRef.value) getDay(todayK()).weight=S.profile.weightRef.value;
    S.onboarded=true;
  }
  const cp=curProfile();
  if(t.name){ cp.name=t.name; writePI(profiles); }
  save();closeAllModals();render();
  toast(t.first?'🎉 开始记录吧':'✓ 已保存');
}

    <div class="chips" style="margin-bottom:6px">${(ICON_SUGGESTIONS[t.kind]||[]).map(ic=>`<div class="chip" data-tk-icon="${ic}" style="padding:6px 10px;font-size:16px">${ic}</div>`).join('')}</div>
    ${isSym?`
      <div class="sub-lbl" style="margin-top:14px">标签名（可选）</div>
      <div class="f"><input class="inp" id="tkTagLabel" value="${esc(t.tagLabel)}" placeholder="例如：部位 / 诱因 / 症状 / 场景"></div>
      <div class="sub-lbl">标签选项（用逗号分隔，可选）</div>
      <div class="f"><input class="inp" id="tkTagOptions" value="${esc(t.tagOptions)}" placeholder="例如：大脚趾,膝盖,腰,肩"></div>
      <div style="font-size:11.5px;color:var(--mu);margin-top:6px;line-height:1.5">不需要标签就留空，只打 0–5 分即可。</div>
    `:`
      <div class="sub-lbl" style="margin-top:14px">状态选项（用逗号分隔）</div>
      <div class="f"><input class="inp" id="tkOptions" value="${esc(t.options)}" placeholder="例如：无,好转,稳定,加重"></div>
      <div style="font-size:11.5px;color:var(--mu);margin-top:6px;line-height:1.5">默认「无/好转/稳定/加重」，颜色会自动匹配。也可改成别的词，如「红/痒/结痂」等。</div>
    `}
  `;
  document.getElementById('trackerModalFt').innerHTML=`<button class="btn" id="tkCancel">取消</button><button class="btn pri" id="tkSave">保存</button>`;
}
function saveTrackerModal(){
  const name=(document.getElementById('tkName')?.value||'').trim();
  if(!name){toast('请输入名称');return}
  const icon=(document.getElementById('tkIcon')?.value||'').trim()||'•';
  const t=trackerTmp;
  if(t.kind==='symptom'){
    const tagLabel=(document.getElementById('tkTagLabel')?.value||'').trim();
    const tagOptionsRaw=(document.getElementById('tkTagOptions')?.value||'').trim();
    const tagOptions=tagOptionsRaw?tagOptionsRaw.split(/[,，、;；]/).map(s=>s.trim()).filter(Boolean):[];
    const obj={id:t.id,name,icon,tagLabel,tagOptions};
    if(t.isEdit){
      const i=(S.symptomTrackers||[]).findIndex(x=>x.id===t.id);
      if(i>=0) S.symptomTrackers[i]=obj; else S.symptomTrackers.push(obj);
    }else{
      if(!Array.isArray(S.symptomTrackers)) S.symptomTrackers=[];
      S.symptomTrackers.push(obj);
    }
  }else{
    const optsRaw=(document.getElementById('tkOptions')?.value||'').trim();
    const options=optsRaw?optsRaw.split(/[,，、;；]/).map(s=>s.trim()).filter(Boolean):['无','好转','稳定','加重'];
    const obj={id:t.id,name,icon,options};
    if(t.isEdit){
      const i=(S.skinTrackers||[]).findIndex(x=>x.id===t.id);
      if(i>=0) S.skinTrackers[i]=obj; else S.skinTrackers.push(obj);
    }else{
      if(!Array.isArray(S.skinTrackers)) S.skinTrackers=[];
      S.skinTrackers.push(obj);
    }
  }
  save();closeAllModals();render({keepScroll:true});toast('✓ 已保存');
}

  const keys=Object.keys(S.days).filter(k=>S.days[k].note&&S.days[k].note.trim()).sort().reverse();

  if(!keys.length){body.innerHTML='<div style="text-align:center;padding:30px 0;color:#b8c3bf;font-style:italic">还没有写过备注</div>'}
  else{
    body.innerHTML=`<input class="inp" id="notesSearch" placeholder="搜索关键词…" style="margin-bottom:12px"><div id="notesList">${keys.map(k=>`<div class="note-item" data-note-key="${k}"><div class="nd">${humanFull(k)}</div><div class="nt">${esc(S.days[k].note)}</div></div>`).join('')}</div>`;
    setTimeout(()=>{
      const search=document.getElementById('notesSearch');

function medAdherence(days){
  const activeMeds=(S.meds||[]).filter(m=>m.active);
  const result={};activeMeds.forEach(m=>{result[m.name]={taken:0,total:0,slots:{}}});
  days.forEach(k=>{
    const day=S.days[k];if(!day)return;
    activeMeds.forEach(m=>{
      (m.times||[]).forEach(t=>{
        result[m.name].total++;
        const key=m.name+'|'+t;
        if(!result[m.name].slots[key]) result[m.name].slots[key]={taken:0,total:0};
        result[m.name].slots[key].total++;
        if(isMedTaken(day,m.id,t)){result[m.name].taken++;result[m.name].slots[key].taken++}
      });
    });
  });
  return result;
}
function daySymSummary(day){
  const parts=[];
  (S.symptomTrackers||[]).forEach(t=>{
    const sc=(day.symptoms?.[t.id]?.score)||0;
    if(sc>0){
      const tags=day.symptoms[t.id].tags||[];
      parts.push(`${t.name}${sc}${tags.length?'('+tags.join('/')+')':''}`);

}

/* ============ 18. 图表 ============ */
function prep(cv){
  const dpr=window.devicePixelRatio||1;const r=cv.getBoundingClientRect();
  const W=r.width||300,H=r.height||150;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  return{ctx,W,H};
}
function empty2(ctx,W,H,msg){
  ctx.fillStyle='#b6c2be';ctx.font='13px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(msg,W/2,H/2);
}
function lineChart(cv,pts,o){
  const{ctx,W,H}=prep(cv);if(!pts.length){empty2(ctx,W,H,'暂无数据');return}
  const pL=42,pR=14,pT=14,pB=24,cw=W-pL-pR,ch=H-pT-pB;
  let vals=pts.map(p=>p.value);let mn=Math.min(...vals),mx=Math.max(...vals);
  if(o.goal!=null){mn=Math.min(mn,o.goal);mx=Math.max(mx,o.goal)}
  if(mx-mn<2){const m=(mx+mn)/2;mn=m-1.5;mx=m+1.5}
  const pad=(mx-mn)*0.15;mn-=pad;mx+=pad;
  const X=i=>pts.length===1?pL+cw/2:pL+cw*i/(pts.length-1);
  const Y=v=>pT+ch*(1-(v-mn)/(mx-mn));
  ctx.strokeStyle='#eef2f0';ctx.lineWidth=1;ctx.fillStyle='#9aa8a3';ctx.font='10px -apple-system,sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
  for(let i=0;i<=3;i++){const y=pT+ch*i/3;ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(pL+cw,y);ctx.stroke();ctx.fillText((mx-(mx-mn)*i/3).toFixed(1),pL-7,y)}
  if(o.goal!=null&&o.goal>=mn&&o.goal<=mx){ctx.save();ctx.setLineDash([5,4]);ctx.strokeStyle='#f0b27a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(pL,Y(o.goal));ctx.lineTo(pL+cw,Y(o.goal));ctx.stroke();ctx.restore()}
  const g=ctx.createLinearGradient(0,pT,0,pT+ch);g.addColorStop(0,o.fill1||'rgba(13,148,136,.18)');g.addColorStop(1,o.fill2||'rgba(13,148,136,0)');
  ctx.beginPath();ctx.moveTo(X(0),pT+ch);pts.forEach((p,i)=>ctx.lineTo(X(i),Y(p.value)));ctx.lineTo(X(pts.length-1),pT+ch);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle=o.color||'#0d9488';ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(X(i),Y(p.value)):ctx.moveTo(X(i),Y(p.value)));ctx.stroke();
  pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(X(i),Y(p.value),pts.length>20?2:3.4,0,7);ctx.fillStyle=o.color||'#0d9488';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.8;ctx.stroke()});
  if(pts.length>1){ctx.fillStyle='#9aa8a3';ctx.font='10px -apple-system,sans-serif';ctx.textBaseline='top';ctx.textAlign='left';ctx.fillText(o.xLabel?o.xLabel(pts[0]):'',pL,pT+ch+7);ctx.textAlign='right';ctx.fillText(o.xLabel?o.xLabel(pts[pts.length-1]):'',pL+cw,pT+ch+7)}
}
function barChart(cv,vals,o){
  const{ctx,W,H}=prep(cv);if(!vals.length){empty2(ctx,W,H,'暂无数据');return}
  const pL=42,pR=12,pT=12,pB=20,cw=W-pL-pR,ch=H-pT-pB;
  const mx=Math.max(o.goal||0,...vals)*1.12||100;
  const gap=3,bw=(cw-gap*(vals.length-1))/vals.length;
  ctx.strokeStyle='#eef2f0';ctx.lineWidth=1;ctx.fillStyle='#9aa8a3';ctx.font='10px -apple-system,sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
  for(let i=0;i<=2;i++){const y=pT+ch*i/2;ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(pL+cw,y);ctx.stroke();ctx.fillText(Math.round(mx-mx*i/2),pL-7,y)}
  if(o.goal){const gy=pT+ch*(1-o.goal/mx);ctx.save();ctx.setLineDash([5,4]);ctx.strokeStyle='#f0b27a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(pL,gy);ctx.lineTo(pL+cw,gy);ctx.stroke();ctx.restore()}
  vals.forEach((v,i)=>{
    const h=v>0?Math.max(2,ch*(v/mx)):0;const x=pL+i*(bw+gap),y=pT+ch-h;
    if(h>0){
      const done=v>=(o.goal||Infinity);const g=ctx.createLinearGradient(0,y,0,y+h);
      if(done){g.addColorStop(0,'#5eead4');g.addColorStop(1,'#0d9488')}else{g.addColorStop(0,'#b8d4cf');g.addColorStop(1,'#87aaa2')}
      ctx.fillStyle=g;const r=Math.min(3.5,bw/2);
      ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.lineTo(x+bw-r,y);ctx.quadraticCurveTo(x+bw,y,x+bw,y+r);ctx.lineTo(x+bw,y+h);ctx.closePath();ctx.fill();
    }
  });
}

/* ============ 19. 渲染调度 ============ */
function render(opts){
  opts=opts||{};
  const savedY=opts.keepScroll?window.scrollY:0;
  cardIndex=0;
  if(!opts.keepScroll){
    viewEl.classList.remove('switching');
    void viewEl.offsetWidth;
    viewEl.classList.add('switching');
  }
  try{
    if(tab==='log') viewEl.innerHTML=logView();
    else if(tab==='cal') viewEl.innerHTML=calView();
    else if(tab==='trend') viewEl.innerHTML=trendView();
    else if(tab==='check') viewEl.innerHTML=checkView();
    else if(tab==='ach') viewEl.innerHTML=achView();
    else viewEl.innerHTML=meView();
  }catch(e){
    viewEl.innerHTML=`<div class="card" style="margin:20px 0"><div class="ch"><span class="t">渲染出错</span></div><div class="tip"><i class="dt"></i><div style="word-break:break-all;font-size:12px">${esc(e.message)}<br><br>${esc(e.stack||'')}</div></div></div>`;
    return;
  }
  document.querySelectorAll('.ni').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));
  requestAnimationFrame(()=>{
    const arc=document.querySelector('.ring-arc');
    if(arc){const targetOffset=arc.dataset.targetOffset;setTimeout(()=>{arc.style.strokeDashoffset=targetOffset},50)}
    const countEl=document.querySelector('[data-count-target]');
    if(countEl){const target=Number(countEl.dataset.countTarget);let cur=0;const step=Math.max(1,Math.ceil(target/20));const timer=setInterval(()=>{cur+=step;if(cur>=target){cur=target;clearInterval(timer)}countEl.textContent=cur},30)}
    document.querySelectorAll('.gb>i, .xp-track>i, .bar>i').forEach(el=>{const w=el.style.width;el.style.width='0';setTimeout(()=>{el.style.width=w},100)});
  });
  if(tab==='trend'){
    requestAnimationFrame(()=>{
      try{
        const cW=document.getElementById('cW');
        if(cW){const pts=Object.keys(S.days).filter(k=>typeof S.days[k].weight==='number'&&S.days[k].weight>0).sort().map(k=>({label:k,value:S.days[k].weight}));lineChart(cW,pts,{color:'#0d9488',goal:S.cfg.weightGoal,xLabel:p=>humanD(p.label)})}
        const cWa=document.getElementById('cWa');
        if(cWa){const vals=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=fmt(d);vals.push(waterTotal(S.days[k]||blankDay()))}barChart(cWa,vals,{goal:S.cfg.waterGoal})}
        const cS=document.getElementById('cSleep');
        if(cS){const vals=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=fmt(d);vals.push(S.days[k]?.sleep?.hours||0)}barChart(cS,vals,{goal:S.cfg.sleepGoal})}
        const cU=document.getElementById('cU');
        if(cU){const pts=[...S.uric].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>({label:x.date,value:x.value}));lineChart(cU,pts,{color:'#dc2626',goal:S.cfg.uaGoal,fill1:'rgba(220,38,38,.16)',fill2:'rgba(220,38,38,0)',xLabel:p=>humanD(p.label)})}
        const cK=document.getElementById('cKcal');
        if(cK){const vals=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=fmt(d);const n=dayNutrition(S.days[k]||blankDay());vals.push(n.has&&n.kcal?Math.round(n.kcal):0)}barChart(cK,vals,{goal:S.cfg.kcalGoal})}
      }catch(e){}
    });
  }
  if(opts.keepScroll) window.scrollTo(0,savedY);
  else window.scrollTo({top:0,behavior:'auto'});
}
