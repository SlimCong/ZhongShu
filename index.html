  if(e.target.closest('[data-export-json]')){
    flushInput();
    const payload={__profile:(curProfile()||{}).name||'我',__exported:todayK(),data:S};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    dl(blob,'健康日志备份_'+(curProfile().name||'我')+'_'+todayK()+'.json');
    lsSet('hl_backup_'+activeId,todayK());
    toast('✓ 备份已导出');render({keepScroll:true});return;
  }
  if(e.target.closest('[data-import]')){document.getElementById('fileInp')?.click();return}
  if(e.target.closest('[data-reset]')){
    if(confirm('清空当前档案的全部记录？基本资料和目标设置会保留，不可恢复。')){
      const keepProf=S.profile, keepCfg=S.cfg;
      LS.del(DKEY(activeId));
      lsDel('hl_backup_'+activeId);
      S=defState();
      S.profile=keepProf;S.cfg=keepCfg;S.onboarded=true;
      recentFoods=[];lsDel('healthlog_recent');calMonth=null;curDate=todayK();
      save();render();toast('已清空');
    }
    return;
  }
});

document.addEventListener('click',e=>{
  /* 追踪项弹窗 */
  const tki=e.target.closest('[data-tk-icon]');
  if(tki){const ic=tki.dataset.tkIcon;const el=document.getElementById('tkIcon');if(el)el.value=ic;return}
  if(e.target.closest('#tkSave')){saveTrackerModal();return}
  if(e.target.closest('#tkCancel')){closeAllModals();return}
  if(e.target.closest('#trackerModalClose')){closeAllModals();return}
  const tkM=document.getElementById('trackerModal');
  if(tkM&&e.target===tkM){closeAllModals();return}

  /* 引导弹窗 */
  const sx=e.target.closest('[data-su-sex]');
  if(sx){collectSetup();setupTmp.sex=sx.dataset.suSex;renderSetup();return}
  const sp=e.target.closest('[data-su-pick]');
  if(sp){collectSetup();const k=sp.dataset.suPick;const i=setupTmp.picks.indexOf(k);if(i>=0)setupTmp.picks.splice(i,1);else setupTmp.picks.push(k);renderSetup();return}
  if(e.target.closest('#suSave')){saveSetup();return}
  if(e.target.closest('#setupClose')){closeAllModals();return}
  const sm=document.getElementById('setupModal');
  if(sm&&e.target===sm){closeAllModals();return}

  /* 复查项弹窗 */
  const ct=e.target.closest('[data-cu-tpl]');
  if(ct){
    const t=CHECKUP_TEMPLATES.find(x=>x.id===ct.dataset.cuTpl);
    if(t){
      const n=document.getElementById('cuName');if(n)n.value=t.name;
      const d=document.getElementById('cuDept');if(d)d.value=t.dept;
      const m=document.getElementById('cuMonths');if(m)m.value=t.months;
    }
    return;
  }
  if(e.target.closest('#cuSave')){saveCuModal();return}
  if(e.target.closest('#cuCancel')){closeAllModals();return}
  if(e.target.closest('#cuModalClose')){closeAllModals();return}
  if(e.target.closest('#cuDel')){
    if(confirm('删除这条复查项？')){
      S.checkups=(S.checkups||[]).filter(x=>x.id!==cuEditId);
      save();closeAllModals();render({keepScroll:true});toast('已删除');
    }
    return;
  }
  const cuM=document.getElementById('cuModal');
  if(cuM&&e.target===cuM){closeAllModals();return}

  /* 药物弹窗 */
  const mt=e.target.closest('[data-mf-time]');
  if(mt){const k=mt.dataset.mfTime;const i=medEditTemp.times.indexOf(k);if(i>=0) medEditTemp.times.splice(i,1); else medEditTemp.times.push(k);renderMedModal();return}
  if(e.target.closest('#mfSave')){saveMedModal();return}
  if(e.target.closest('#mfCancel')){closeAllModals();return}
  if(e.target.closest('#medModalClose')){closeAllModals();return}
  const medModal=document.getElementById('medModal');
  if(medModal&&e.target===medModal){closeAllModals();return}

  /* 营养弹窗 */
  if(e.target.closest('#nutParse')){
    const txt=document.getElementById('nutPaste')?.value||'';
    const p=parseNutritionText(txt);
    const fill=(id,val)=>{const el=document.getElementById(id);if(el&&(el.value===''||el.value==null)&&val!=null)el.value=val};
    fill('nutProtein',p.protein);fill('nutFat',p.fat);fill('nutCarbs',p.carbs);fill('nutKcal',p.kcal);fill('nutSodium',p.sodium);
    const lbl=document.getElementById('nutLabel');
    if(lbl&&!lbl.value){const firstLine=txt.split('\n')[0].trim();if(firstLine&&firstLine.length<40&&!/蛋白质|脂肪|碳水|热量|钠/.test(firstLine)) lbl.value=firstLine}
    const found=['protein','fat','carbs','kcal','sodium'].filter(k=>p[k]!=null).length;
    toast(found>0?`✓ 解析到 ${found} 项`:'没解析到，手动填');
    return;
  }
  if(e.target.closest('#nutClear')){['nutLabel','nutProtein','nutFat','nutCarbs','nutKcal','nutSodium','nutPaste'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});return}
  if(e.target.closest('#nutSave')){saveNutModal();return}
  if(e.target.closest('#nutCancel')){closeAllModals();return}
  if(e.target.closest('#nutModalClose')){closeAllModals();return}
  const nutModal=document.getElementById('nutModal');
  if(nutModal&&e.target===nutModal){closeAllModals();return}

  /* 备注弹窗 */
  if(e.target.closest('#notesModalClose')||e.target.closest('#notesOk')){document.getElementById('notesModal').classList.remove('show');return}
  const notesModal=document.getElementById('notesModal');
  if(notesModal&&e.target===notesModal){notesModal.classList.remove('show');return}

  /* 其他 */
  if(e.target.closest('#celebOk')){document.getElementById('celebrateModal').classList.remove('show');return}
  if(e.target.closest('#achDetailOk')||e.target.closest('#achDetailModal')){document.getElementById('achDetailModal').classList.remove('show');return}
  if(e.target.closest('#modalCopy')){
    const ta=document.getElementById('modalText');
    if(ta){navigator.clipboard?.writeText(ta.value).then(()=>toast('✓ 已复制')).catch(()=>{ta.select();document.execCommand('copy');toast('✓ 已复制')})}
    return;
  }
  if(e.target.closest('#modalOk')||e.target.closest('#modalClose')){document.getElementById('modal').classList.remove('show');return}
  const rModal=document.getElementById('modal');
  if(rModal&&e.target===rModal){rModal.classList.remove('show');return}
});

const pending={};
view.addEventListener('focusin',e=>{if(e.target.matches('input, textarea, select')) pending[e.target]=e.target.value});
view.addEventListener('input',e=>{pending[e.target]=e.target.value});
view.addEventListener('focusout',e=>{commitField(e.target)});
view.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')&&e.target.type!=='textarea'){e.preventDefault();e.target.blur()}});

function commitField(el){
  if(!el||!el.matches||!('value' in el))return;
  const t=el;
  if(pending[t]===t.value){delete pending[t];return}
  const val=t.value;
  delete pending[t];
  const day=getDay(curDate);
  if(t.dataset.field){
    const k=t.dataset.field;
    if(k==='weight'||k==='waist'){
      const v=parseFloat(val);const wasEmpty=day[k]==null;
      day[k]=(!isNaN(v)&&v>0&&v<400)?v:null;
      save();
      if(wasEmpty&&day[k]!=null) addXP(k==='weight'?XP.weight:XP.waist);
      render({keepScroll:true});toast('✓ 已保存');
      return;
    }
  }
  if(t.dataset.bp){
    const k=t.dataset.bp;if(!day.bp) day.bp={sys:null,dia:null,hr:null};
    const wasEmpty=day.bp[k]==null;const v=parseFloat(val);
    day.bp[k]=(!isNaN(v)&&v>0)?v:null;
    save();
    if(wasEmpty&&day.bp[k]!=null) addXP(XP.bp);
    render({keepScroll:true});toast('✓ 已保存');
    return;
  }
  if(t.dataset.sleep){
    const k=t.dataset.sleep;if(!day.sleep) day.sleep={hours:null,quality:null,nocturia:null};
    const wasEmpty=day.sleep[k]==null;const v=parseFloat(val);
    day.sleep[k]=(!isNaN(v)&&v>=0)?v:null;
    save();
    if(wasEmpty&&day.sleep[k]!=null) addXP(XP.sleep);
    render({keepScroll:true});toast('✓ 已保存');
    return;
  }
  if(t.dataset.void){
    const k=t.dataset.void;const wasEmpty=day.voiding[k]==null;
    const v=parseFloat(val);day.voiding[k]=(!isNaN(v)&&v>=0)?v:null;
    save();
    if(wasEmpty&&day.voiding[k]!=null) addXP(XP.void);
    render({keepScroll:true});toast('✓ 已保存');
    return;
  }
  if(t.dataset.bowel==='count'){const v=parseFloat(val);day.bowel.count=(!isNaN(v)&&v>=0)?v:null;save();render({keepScroll:true});toast('✓ 已保存');return}
  if(t.dataset.note!==undefined){
    const wasEmpty=!day.note||!day.note.trim();
    day.note=val;save();
    if(wasEmpty&&val.trim()) addXP(XP.note);
    toast('✓ 已保存');
    setTimeout(checkDailyBonus,500);
    return;
  }
  if(t.dataset.cfg){const k=t.dataset.cfg;const v=parseFloat(val);if(!isNaN(v)&&v>=0){S.cfg[k]=v;save();toast('✓ 已保存')}return}
  /* 排便性状选项 */
  if(t.id==='bowelOpts'){
    const opts=val.split(/[,，、;；]/).map(s=>s.trim()).filter(Boolean);
    S.bowelTypeOptions=opts;
    save();render({keepScroll:true});toast('✓ 已保存');
    return;
  }
}
function flushInput(){const a=document.activeElement;if(a&&view.contains(a))commitField(a)}

document.addEventListener('change',e=>{
  if(e.target.id!=='fileInp')return;
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const raw=JSON.parse(r.result);
      const data=raw&&raw.data?raw.data:raw;
      if(!data.days)throw new Error('格式不对');
      if(!confirm('导入会覆盖当前档案的全部记录，确定吗？'))return;
      const d=defState();
      S={
        onboarded:true,
        profile:Object.assign({},d.profile,data.profile||{}),
        days:data.days||{},
        uric:Array.isArray(data.uric)?data.uric:[],
        history:Array.isArray(data.history)?data.history:[],
        checkups:Array.isArray(data.checkups)?data.checkups:[],
        meds:Array.isArray(data.meds)?data.meds:[],
        cfg:Object.assign({},d.cfg,data.cfg||{}),
        goal:data.goal||null,collapsed:data.collapsed||{},
        myFoods:Array.isArray(data.myFoods)?data.myFoods:[],
        gamification:Object.assign({},d.gamification,data.gamification||{}),
        symptomTrackers:Array.isArray(data.symptomTrackers)?data.symptomTrackers:defaultSymptomTrackers(),
        skinTrackers:Array.isArray(data.skinTrackers)?data.skinTrackers:defaultSkinTrackers(),
        bowelEnabled:data.bowelEnabled!==false,
        bowelTypeOptions:Array.isArray(data.bowelTypeOptions)&&data.bowelTypeOptions.length?data.bowelTypeOptions:['1','2','3','4','5','6','7']
      };
      if(data.profile&&data.profile.weightRef) S.profile.weightRef=data.profile.weightRef;
      save();render();toast('✓ 导入成功');
    }catch(err){alert('导入失败：'+err.message)}
  };
  r.readAsText(f);e.target.value='';
});

document.querySelectorAll('.ni').forEach(el=>{
  el.addEventListener('click',()=>{
    if(tab===el.dataset.tab)return;
    flushInput();
    if(el.dataset.tab==='cal'&&!calMonth){const d=parseD(curDate);calMonth={y:d.getFullYear(),m:d.getMonth()}}
    tab=el.dataset.tab;render();
  });
});

let rt=null;
window.addEventListener('resize',()=>{if(tab!=='trend')return;clearTimeout(rt);rt=setTimeout(()=>render({keepScroll:true}),200)});

/* ============ 21. 弹窗通用 ============ */
function openReport(title,text){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=`<textarea id="modalText" readonly></textarea>`;
  document.getElementById('modalText').value=text;
  document.getElementById('modal').classList.add('show');
}
function closeAllModals(){
  ['modal','medModal','cuModal','nutModal','notesModal','celebrateModal','achDetailModal','setupModal','trackerModal'].forEach(id=>{
    const el=document.getElementById(id);if(el) el.classList.remove('show');
  });
}
function dl(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  if(!el)return;
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1700);
}

/* ============ 22. 启动 ============ */
getDay(todayK());
updateStreak();
save();
render();
if(!S.onboarded){
  setTimeout(()=>openSetup(true), 400);
}else if((S.gamification.xp||0)===0 && !(S.gamification.achievements||[]).length){
  setTimeout(()=>{confetti(30);toast('👋 欢迎回来！记录就送 XP')}, 800);
}
